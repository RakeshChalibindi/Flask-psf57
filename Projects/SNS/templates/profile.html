{% extends "base.html" %}

{% block title %}
SNS - Profile
{% endblock %}

{% block navmenu %}
<a href="{{ url_for('dashboard') }}">Dashboard</a>
<a href="{{ url_for('myfiles') }}">Files</a>
<a href="{{ url_for('mynotes') }}">Notes</a>
<a href="{{ url_for('profile') }}">Profile</a>
<a href="{{ url_for('logout') }}">Logout</a>
{% endblock %}

{% block content %}

<div class="profile-container">

    <h1>My Profile</h1>

    <div class="profile-card">

        <h2>{{ username }}</h2>

        <p>
            <strong>Email:</strong>
            {{ email }}
        </p>

    </div>

</div>

{% endblock %}

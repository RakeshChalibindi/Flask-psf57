<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Files</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        /* Upload */

        .upload-box {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        .upload-form {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .upload-form input {
            flex: 1;
        }

        .upload-form button {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Search */

        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .search-form input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .search-form button {
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            cursor: pointer;
        }

        /* File */

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 18px;

            border: 1px solid #ddd;
            border-radius: 8px;

            margin-bottom: 12px;
        }

        .file-name {
            font-weight: bold;
            word-break: break-word;
            max-width: 40%;
        }

        .actions {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .actions a {
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 5px;
            color: white;
            font-size: 14px;
        }

        .view {
            background: #28a745;
        }

        .edit {
            background: #ffc107;
            color: black !important;
        }

        .download {
            background: #007bff;
        }

        .delete {
            background: #dc3545;
        }

        .no-files {
            text-align: center;
            color: #777;
            padding: 30px;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>📁 My Files</h1>


    <!-- ========================= -->
    <!-- Upload -->
    <!-- ========================= -->

    <div class="upload-box">

    <h2>Upload New File</h2>

    <form action="{{ url_for('myfiles') }}"
          method="POST"
          enctype="multipart/form-data">

        <input type="file"
               name="file"
               required>

        <button type="submit">
            📤 Upload
        </button>

    </form>

</div>
    <!-- ========================= -->
    <!-- Search -->
    <!-- ========================= -->

    <form
        action="{{ url_for('search_files') }}"
        method="GET"
        class="search-form"
    >

        <input
            type="text"
            name="q"
            placeholder="Search your files..."
            value="{{ search_text }}"
        >

        <button type="submit">
            🔍 Search
        </button>

    </form>


    <!-- ========================= -->
    <!-- Files -->
    <!-- ========================= -->

    {% if files %}

        {% for file in files %}

        <div class="file-item">


            <!-- File name -->

            <div class="file-name">

                📄 {{ file }}

            </div>


            <!-- Actions -->

            <div class="actions">


                <!-- View -->

                <a
                    href="{{ url_for('view_file', filename=file) }}"
                    target="_blank"
                    class="view"
                >
                    👁 View
                </a>


                <!-- Edit -->

                <a
                    href="{{ url_for('edit_file', filename=file) }}"
                    class="edit"
                >
                    ✏️ Edit
                </a>


                <!-- Download -->

                <a
                    href="{{ url_for('download_file', filename=file) }}"
                    class="download"
                >
                    ⬇ Download
                </a>


                <!-- Delete -->

                <a
                    href="{{ url_for('delete_file', filename=file) }}"
                    class="delete"
                    onclick="return confirm('Are you sure you want to delete this file?')"
                >
                    🗑 Delete
                </a>

            </div>

        </div>

        {% endfor %}

    {% else %}

        <div class="no-files">

            {% if search_text %}

                No files found for:
                <b>{{ search_text }}</b>

            {% else %}

                No files uploaded yet.

            {% endif %}

        </div>

    {% endif %}


</div>

</body>

</html>

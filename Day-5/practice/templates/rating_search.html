<!DOCTYPE html>
<html>
<head><title>Search by Rating</title></head>
<body>
    <h2>Rating Search</h2>
    <form method="POST">
        <label>Enter Rating:</label>
        <input type="text" name="rating" required>
        <input type="submit" value="Search">
    </form>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% elif searched %}
        {% if results %}
            <h3>Results:</h3>
            <ul>
                {% for title in results %}
                    <li>{{ title }}</li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No movies found</p>
        {% endif %}
    {% endif %}
    <br>
    <a href="{{ url_for('home') }}">Back to Home</a>
</body>
</html>

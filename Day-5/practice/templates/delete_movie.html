<!DOCTYPE html>
<html>
<head><title>Delete Movie</title></head>
<body>
    <h2>Delete Movie</h2>
    {% if message %}
        <p style="color:red;">{{ message }}</p>
    {% endif %}
    <form method="POST">
        <label>Enter Movie ID:</label>
        <input type="text" name="movie_id" required>
        <input type="submit" value="Delete Movie">
    </form>
    <br>
    <a href="{{ url_for('home') }}">Back to Home</a>
</body>
</html>

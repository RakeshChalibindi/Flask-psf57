<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Director Search</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2>Director Search</h2>
    <form method="POST">
        <label>Enter Director Name:</label><br>
        <input type="text" name="director" required><br>
        <input type="submit" value="Search">
    </form>

    {% if searched %}
        {% if results %}
            <h3>Movies Directed By {{ director }}</h3>
            <ul>
                {% for title in results %}
                    <li>{{ title }}</li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No movies found</p>
        {% endif %}
    {% endif %}
    <br>
    <a href="{{ url_for('home') }}">Back to Home</a>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students</title>
</head>
<body>
    <div>
        <h1>AllStudent</h1>
    </div>
    <div>
        {% for id in students %}
            <p>Name:{{students[id]["name"]}}</p>
            <p>Age:{{students[id].age}}</p>
            <p>class:{{students[id]["class"]}}</p>
            <p>marks:{{students[id]["marks"]}}</p>
            {% if students[id]["marks"] > 40 %}
                <p>status:pass</p>
            {% else %}
                <p>status:fail</p>
            {% endif %}
        {% endfor %}
        <hr>
    </div>
</div>
</body>
</html>
